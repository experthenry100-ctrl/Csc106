<section class="wrap split">
<div>
<h1>Contact me</h1>
<form id="contact-form" novalidate>
<label for="name">Name</label>
<input id="name" type="text" autocomplete="name">
<p class="error" id="name-err"></p>
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email">
<p class="error" id="email-err"></p>
<label for="phone">Phone number</label>
<input id="phone" type="tel" inputmode="numeric" autocomplete="tel">
<p class="error" id="phone-err"></p>
<label for="message">Message</label>
<textarea id="message" rows="5"></textarea>
<p class="error" id="message-err"></p>
<button class="btn" type="submit">Send message</button>
<p id="form-ok" class="ok" role="status"></p>
</form>
</div>
