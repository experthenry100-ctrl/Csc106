<main>
<section class="wrap narrow">
<h1>Academic planner</h1>
<p>Add your assignments, lectures and study goals. Tasks are saved in this browser.</p>
<form id="task-form" class="row" novalidate>
<label for="task-input" class="sr">New task</label>
<input id="task-input" type="text" placeholder="e.g. Finish COS 106 term project" maxlength="100" autocomplete="off">
<button class="btn" type="submit">Add task</button>
</form>
<p id="task-error" class="error" role="alert"></p>
<p id="task-count" class="muted" aria-live="polite"></p>
<ul id="task-list" class="tasks"></ul>
</section>
</main>
